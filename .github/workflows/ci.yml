name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/refined-prototype
  pull_request:
    branches:
      - main

jobs:
  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run Linter
        working-directory: ./frontend
        run: npm run lint

      - name: Run Build (includes Typecheck)
        working-directory: ./frontend
        run: npm run build

  backend-checks:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: geoflare_user
          POSTGRES_PASSWORD: geoflare_password
          POSTGRES_DB: geoflare
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Initialize Database
        env:
          PGPASSWORD: geoflare_password
        run: |
          psql -h 127.0.0.1 -p 5433 -U geoflare_user -d geoflare -f backend/db/schema.sql
          psql -h 127.0.0.1 -p 5433 -U geoflare_user -d geoflare -f backend/db/seed.sql
          psql -h 127.0.0.1 -p 5433 -U geoflare_user -d geoflare -f backend/db/migration_alert_history.sql

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://geoflare_user:geoflare_password@127.0.0.1:5433/geoflare
          FIRMS_ENABLED: 'false'
        run: python -m pytest
